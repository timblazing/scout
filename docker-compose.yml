# Scout - Docker Compose
#
# LINUX ONLY. Docker Desktop on macOS and Windows runs containers inside a VM
# that never sees your real network, so scans report nothing useful there.
#
# The dashboard has no login. Anyone who can reach this port can see your
# device list and start a scan. Keep it on a trusted network, or put a reverse
# proxy with authentication in front of it.

services:
  scout:
    image: ghcr.io/timblazing/scout:latest
    container_name: scout
    restart: unless-stopped

    # Scanning needs the host's network, not Docker's private bridge.
    network_mode: host

    # nmap needs raw sockets to read the ARP table (MAC addresses and vendors);
    # NET_BIND_SERVICE covers the privileged port 291.
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE

    environment:
      - ORANGUTAN_PORT=291
      - TZ=America/Chicago
      # Optional:
      # - ORANGUTAN_NETWORKS=192.168.1.0/24
      # - ORANGUTAN_SCAN_INTERVAL=300
      # - ORANGUTAN_CONTINUOUS_SCAN=true

    volumes:
      # Device list and scan history. Existing lan-orangutan data works as-is.
      - ./data:/var/lib/lan-orangutan
